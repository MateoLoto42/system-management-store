<header class="h-16 flex items-center justify-between px-4 bg-stone-300/10 relative">
  <!-- Logo -->
  <div class="flex items-center justify-center mt-6 mb-6">
      <img src="assets\trut2.png" alt="" class=" h-10">
  </div>

  <!-- Botón menú -->
  <button 
    (click)="toggleMenu()" 
    class=" text-neutral-700 rounded-full p-2 shadow-md focus:outline-none ">
    <lucide-angular [img]="menu" class="w-5 h-5 text-neutral-100 hover:text-neutral-300 "></lucide-angular>
  </button>

  <!-- Menú desplegable -->
  <div 
    *ngIf="menuOpen" 
    class="absolute top-16 right-4 w-56 bg-neutral-800/95 text-white rounded-xl shadow-lg p-3 z-50">
    <ul class="space-y-2">
      <li><a routerLink="/dashboard" class="block hover:bg-neutral-700/50 rounded-md p-2">Dashboard</a></li>
      <li><a routerLink="/product" class="block hover:bg-neutral-700/50 rounded-md p-2">Productos</a></li>
      <li><a routerLink="/sale" class="block hover:bg-neutral-700/50 rounded-md p-2">Ventas</a></li>
      <li><a routerLink="/customer" class="block hover:bg-neutral-700/50 rounded-md p-2">Clientes</a></li>
      <li><a routerLink="/supplier" class="block hover:bg-neutral-700/50 rounded-md p-2">Proveedores</a></li>
      <li><a routerLink="/user" class="block hover:bg-neutral-700/50 rounded-md p-2">Usuarios</a></li>
      <li><a routerLink="/report" class="block hover:bg-neutral-700/50 rounded-md p-2">Reportes</a></li>
      <li><a routerLink="/security" class="block hover:bg-neutral-700/50 rounded-md p-2">Seguridad</a></li>
      <li><a routerLink="/config" class="block hover:bg-neutral-700/50 rounded-md p-2">Configuración</a></li>
      <li><a routerLink="/perfil" class="block hover:bg-neutral-700/50 rounded-md p-2">Perfil</a></li>
      <li><a routerLink="/logout" class="block hover:bg-red-500/40 rounded-md p-2">Cerrar sesión</a></li>
    </ul>
  </div>
</header>
