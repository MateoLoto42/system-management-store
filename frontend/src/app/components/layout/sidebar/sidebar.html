<aside class="text-white  w-64 h-screen flex flex-col">
  <!-- Logo centrado -->
  <div class="flex items-center justify-center mt-6 mb-6">
      <img src="assets\trut2.png" alt="" class=" h-10">
  </div>
  <!-- Menú -->
  <nav class="flex-1 px-4 space-y-2">
    <a routerLink="/dashboard"  routerLinkActive="bg-neutral-700" class="flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
          <lucide-angular [img]="LayoutDashboard" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Dashboard</span>
    </a>
    <a routerLink="/product"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="Package" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Productos</span>
    </a>
    <a routerLink="/category"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="Tag" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Categoria</span>
    </a>
    <a routerLink="/sale"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg border border-neutral-600 hover:bg-neutral-700 transition">
       <lucide-angular [img]="ShoppingCart" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Vender (POS)</span>
    </a>
    <a routerLink="/customer"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="Users" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Clientes</span>
    </a>
    <a routerLink="/supplier"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="Container" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Proveedores</span>
    </a>
    <a routerLink="/user"  routerLinkActive="bg-neutral-700" class=" flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="BookUser" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Usuarios</span>
    </a>
    <a routerLink="/report"  routerLinkActive="bg-neutral-700" class="flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="FileStack" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Reportes</span>
    </a>
    <a routerLink="/security"  routerLinkActive="bg-neutral-700" class="flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="ShieldCheck" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Seguridad</span>
    </a>
    <a routerLink="/config"  routerLinkActive="bg-neutral-700" class="flex items-center px-3 py-3 rounded-lg hover:bg-neutral-700 transition">
       <lucide-angular [img]="Cog" class="w-5 h-5 text-neutral-100"></lucide-angular>
      <span class="ml-2">Configuración</span>
    </a>
  </nav>
<!-- Navbar -->
<nav class="items-center">
  <!-- Contenedor padre -->
  <div class="px-4 mb-4 relative">
    <!-- Botón -->
    <button (click)="toggleDropdown()"
      class="cursor-pointer flex items-center justify-between w-full px-3 py-2 rounded-lg border-1 border-neutral-100/20  hover:bg-neutral-700 transition">
      <!-- Avatar + datos -->
      <div class="flex items-center space-x-3">
        <img
          src="https://avatars.githubusercontent.com/u/67022746?v=4"
          alt="Perfil"
          class="w-10 h-10 rounded-full"
        />
        <div class="text-left">
          <p class="text-sm font-semibold text-white">Usuario Kiosco</p>
          <span class="text-xs text-neutral-400">Administrador</span>
        </div>
      </div>
      <!-- Flecha -->
      <lucide-angular [img]="ChevronRight" class="w-5 h-5 text-neutral-400"></lucide-angular>
    </button>

    <!-- Dropdown -->
     @if(isOpen){
      <div  class="p-1 absolute bottom-0 left-full  ml-2 w-48 bg-neutral-800 rounded-xl shadow-lg border border-neutral-700/40 overflow-hidden z-50 ">
      <a href="#" class="rounded-lg flex items-center px-4 py-2 text-sm text-neutral-200 hover:bg-neutral-700/50">
        <lucide-angular [img]="User" class="w-4 h-4 mr-2"></lucide-angular>
        Mi perfil
      </a>
      <a href="#" class="rounded-lg flex items-center px-4 py-2 text-sm text-neutral-200 hover:bg-neutral-700/50">
        <lucide-angular [img]="Profile" class="w-4 h-4 mr-2"></lucide-angular>
        Subir foto
      </a>
      <a href="#" class="rounded-lg flex items-center px-4 py-2 text-sm text-neutral-200 hover:bg-neutral-700/50">
        <lucide-angular [img]="Settings" class="w-4 h-4 mr-2"></lucide-angular>
        Configuración
      </a>
      <a href="#" class="rounded-lg flex items-center px-4 py-2 text-sm text-red-300 hover:bg-red-400/15">
        <lucide-angular [img]="LogOut" class="w-4 h-4 mr-2"></lucide-angular>
        Cerrar sesión
      </a>
    </div>
     }
    
  </div>
</nav>

</aside>
