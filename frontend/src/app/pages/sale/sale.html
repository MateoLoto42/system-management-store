<section class="text-white">
  <header class="h-16 mb-5 rounded-xl flex items-center justify-between px-6 bg-neutral-700/30">
    <h1 class="text-2xl font-bold">Punto de Venta</h1>
  </header>

  <div class="grid grid-cols-4 grid-rows-5 gap-4">
    <!-- Columna izquierda: Productos -->
    <div class="col-span-3 row-span-5 bg-neutral-400/10 rounded-2xl p-4">
      
      <!-- Header -->
      <div class="grid grid-rows-2 gap-4 mb-4">
        <!-- Row 1 -->
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold">Carrito de compra</h2>
          <div class="flex items-center gap-2">
            <input type="text" placeholder="Buscar producto o escanear"
              class="px-3 py-2 rounded-lg bg-neutral-800/50 border border-neutral-700/50 text-sm w-64 focus:outline-none">
            <button class="p-2 rounded-lg bg-neutral-700 hover:bg-neutral-600">
              <lucide-angular [img]="Search" class="w-5 h-5"></lucide-angular>
            </button>
          </div>
        </div>

        <!-- Row 2: categorías -->
        <div class="flex flex-wrap gap-2">
          <button class="px-3 py-1 text-xs rounded-full bg-neutral-600 hover:bg-neutral-500">Todos</button>
          <button class="px-3 py-1 text-xs rounded-full bg-blue-600/60 hover:bg-blue-500/80">Mercadería</button>
          <button class="px-3 py-1 text-xs rounded-full bg-teal-600/60 hover:bg-teal-500/80">Lácteos</button>
          <button class="px-3 py-1 text-xs rounded-full bg-orange-600/60 hover:bg-orange-500/80">Snacks</button>
        </div>
      </div>

      <!-- Productos -->
      <div class="grid grid-cols-6 gap-4">
        <!-- Card producto ejemplo -->
         @for(p of products; track p.id){
            <div class="hover:bg-neutral-800 border-1 border-neutral-300/15 rounded-xl p-3 flex flex-col justify-between">
                <div class="flex justify-between items-start">
                  <!-- Superior izquierda: Nombre + Descripción -->
                  <div class="flex flex-col">
                    <h3 class="text-sm font-bold">{{ p.title }}</h3>
                    <p class="text-xs text-neutral-400">{{ p.description }}</p>
                  </div>
                 
                </div>
                <div class="flex justify-between items-center mt-3">
                  <!-- Inferior izquierda: Precio -->
                  <p class="text-lg font-semibold">$ {{ p.price }}</p>
                  <!-- Inferior derecha: Controles cantidad -->
                  <button class="bg-cyan-600 hover:bg-cyan-700 flex items-center px-2 py-2 rounded-full text-sm font-medium"><lucide-angular [img]="plus" class="w-4 h-4 "></lucide-angular></button>
                </div>
              </div>
         }
        
      </div>
    </div>

    <!-- Columna derecha: Carrito -->
    <div class="row-span-5 col-start-4 bg-neutral-400/10 rounded-2xl p-4 h-[80vh] flex flex-col">
      
      <!-- Encabezado -->
      <div class="mb-4 flex justify-between items-center">
        <h2 class="text-lg font-bold">Orden #12345</h2>
        <div class="grid grid-cols-2 gap-2">
          <button class="p-2 rounded-lg border-1 border-neutral-200/20 text-stone-100 hover:bg-neutral-600">
                <lucide-angular [img]="Edit" class="w-5 h-5"></lucide-angular>
          </button>
          <button class="p-2 rounded-lg border-1 border-neutral-200/20 text-red-400 hover:bg-neutral-600">
                <lucide-angular [img]="Trash" class="w-5 h-5"></lucide-angular>
          </button>
        </div>
        
      </div>

      <!-- Lista de productos -->
      <div class="rounded-lg p-2 mb-4 ">
        <h2 class="text-lg font-bold">Items Detail</h2>
        
        <div class="grid grid-cols-3 text-sm py-1 ">
          <span><div class="flex items-center gap-2">
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">-</button>
                    <span class="text-sm">1x</span>
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">+</button>
                  </div>
                </span><span>Leche</span><span class="text-right font-medium">$4.00</span>
        </div>
        <div class="grid grid-cols-3 text-sm py-1">
          <span><div class="flex items-center gap-2">
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">-</button>
                    <span class="text-sm">2x</span>
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">+</button>
                  </div></span><span>Pan</span><span class="text-right font-medium">$1.50</span>
        </div>
        <div class="grid grid-cols-3 text-sm py-1">
          <span><div class="flex items-center gap-2">
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">-</button>
                    <span class="text-sm">3x</span>
                    <button class="w-6 h-6 flex items-center justify-center rounded-full bg-neutral-700 hover:bg-neutral-600">+</button>
                  </div></span><span>Queso</span><span class="text-right font-medium">$6.00</span>
        </div>
      </div>

      <!-- Resumen -->
      <div class="mb-4">
        <h2 class="text-lg font-bold mb-2">Resumen de pago</h2>
        <div class="flex justify-between text-sm">
          <span>Subtotal</span><span>$11.50</span>
        </div>
        <div class="flex justify-between text-sm font-bold">
          <span>Total</span><span>$11.50</span>
        </div>
      </div>

      <!-- Método de pago -->
      <div class="mb-4">
        <h2 class="text-lg font-bold mb-2">Método de pago</h2>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 p-2 rounded-lg bg-neutral-700 cursor-pointer">
            <input type="radio" name="pago" value="card" class="accent-cyan-600">
            Tarjeta
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-neutral-700 cursor-pointer">
            <input type="radio" name="pago" value="cash" class="accent-cyan-600">
            Efectivo
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-neutral-700 cursor-pointer">
            <input type="radio" name="pago" value="qr" class="accent-cyan-600">
            QR
          </label>
          <label class="flex items-center gap-2 p-2 rounded-lg bg-neutral-700 cursor-pointer">
            <input type="radio" name="pago" value="transfer" class="accent-cyan-600">
            Transferencia
          </label>
        </div>
      </div>

      <!-- Botones finales -->
      <div class="mt-auto flex justify-between gap-2">
        <button class="w-1/2 bg-neutral-600 hover:bg-neutral-500 py-2 rounded-lg flex items-center justify-center gap-2">
          <lucide-angular [img]="Printer" class="w-4 h-4"></lucide-angular> Print
        </button>
        <button class="w-1/2 bg-cyan-600 hover:bg-cyan-500 py-2 rounded-lg flex items-center justify-center gap-2">
          <lucide-angular [img]="CheckCircle" class="w-4 h-4"></lucide-angular> Pagar
        </button>
      </div>
    </div>
  </div>
</section>
