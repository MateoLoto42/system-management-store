<section class="text-white">
  <!-- Header de la página -->
  <header class="h-16 mb-5 rounded-xl flex items-center justify-between px-6 bg-neutral-700/30">
    <h1 class="text-2xl font-bold">Categorias</h1>
  </header>

  <!-- Grid principal -->
  <div class="grid grid-cols-4 grid-rows-4 gap-5">
    <!-- Tabla de productos -->
    <div class=" col-span-3 row-span-4 bg-neutral-400/10 rounded-2xl p-6 ">
        <!-- Header tabla -->
        <div class="flex justify-between items-center mb-4 ">
        <!-- Buscador + filtros -->
        <div class="flex items-center space-x-2">
            <input type="text" placeholder="Buscar producto..." 
            class="px-3 py-2 rounded-lg bg-neutral-700/50 border border-neutral-600 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-sm" />
            <button class="flex items-center px-3 py-2 rounded-lg bg-neutral-700/50 border border-neutral-600 hover:bg-neutral-600 text-sm">
                <lucide-angular [img]="filter" class="w-4 h-4 mr-1"></lucide-angular>Filtrar</button>
            <button (click)="toggleDropdown()" class="cursor-pointer flex items-center justify-between px-3 py-2 rounded-lg bg-neutral-700/50 border border-neutral-600 hover:bg-neutral-600 text-sm">
                <div class="flex items-center">
                    Estado
                </div>
                <lucide-angular [img]="ChevronRight" class="w-4 h-4 text-neutral-400"></lucide-angular>
            </button> 
        </div>
        <!-- Botones acción -->
        <div class="flex items-center space-x-2">
            <button class="flex items-center px-2 py-2 rounded-lg bg-neutral-700/50 hover:bg-neutral-600 border border-neutral-600 text-sm font-medium">
            <lucide-angular [img]="plus" class="w-4 h-4 mr-1"></lucide-angular>Agregar Producto</button>
            <button class="px-4 py-2 rounded-lg bg-neutral-700/50 hover:bg-neutral-600 border border-neutral-600 text-sm font-medium">Exportar</button>
        </div>
        </div>

        <!-- Tabla -->
        <div class="overflow-x-auto border-1 rounded-lg border-neutral-100/15 h-[65vh] ">
        <table class="w-full text-left border-collapse ">
            <thead class="bg-neutral-200/10 text-neutral-300 text-sm">
            <tr>
                <th class="px-4 py-2">#</th>
                <th class="px-4 py-2">Nombre Categoria</th>
                <th class="px-4 py-2">Descripcion</th>
                <th class="px-4 py-2 text-right">Acciones</th>
            </tr>
            </thead>
            <tbody class="text-neutral-200 text-sm divide-y divide-neutral-700/40">
            @for (category of categories; track category.id) {
            <tr class="hover:bg-neutral-700/20">
                <td class="px-4 py-3">{{ category.id }}</td>
                <td class="px-4 py-3">{{ category.nombre }}</td>
                <td class="px-4 py-3">{{ category.descripcion }}</td>
                <td class="py-3 text-center relative">
                <div class="relative inline-block">
                  <!-- Botón del menú -->
                  <button (click)="toggleMenu(category.id)" class="p-2 rounded-full hover:bg-neutral-600/60 cursor-pointer">
                    <lucide-angular [img]="ellipsis" class="w-5 h-5"></lucide-angular>
                  </button>

                  <!-- Dropdown -->
                  @if(openMenuId === category.id){
                    <div class="absolute right-0  mt-2 w-36 bg-neutral-800 text-white rounded-xl shadow-lg border border-neutral-700/50 z-50">
                    <ul class=" text-sm p-1">
                      <li>
                        <button
                          class="w-full text-left px-4 py-2 rounded-lg text-neutral-200 hover:bg-neutral-700 flex items-center space-x-2"
                          (click)="viewCategory(category)"
                        >
                          <lucide-angular [img]="view" class="w-4 h-4"></lucide-angular>
                          <span>Ver</span>
                        </button>
                      </li>
                      <li>
                        <button
                          class="w-full text-left px-4 py-2 rounded-lg text-neutral-200 hover:bg-blue-900 flex items-center space-x-2"
                          (click)="editCategory(category)"
                        >
                          <lucide-angular [img]="edit" class="w-4 h-4"></lucide-angular>
                          <span>Editar</span>
                        </button>
                      </li>
                      <li>
                        <button
                          class="w-full text-left px-4 py-2 rounded-lg text-neutral-200 hover:bg-red-900 flex items-center space-x-2"
                          (click)="deleteCategory(category)"
                        >
                          <lucide-angular [img]="delete" class="w-4 h-4"></lucide-angular>
                          <span>Eliminar</span>
                        </button>
                      </li>
                    </ul>
                    </div>
                  }
                  
                </div>
              </td>
            </tr>
            }
            <!-- Más filas... -->
            </tbody>
        </table>
        </div>
    </div>
        <!-- Segunda Columna -->
        <div class="bg-neutral-400/10 rounded-2xl p-4 flex flex-col justify-between row-span-4 col-start-4">
            <h2 class="text-sm text-neutral-400">Titulo</h2>
            <p class="text-3xl font-bold">123</p>
        </div>
  </div>
</section>
